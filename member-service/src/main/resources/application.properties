spring.application.name=member-service
spring.config.import=optional:classpath:application-secret.properties

server.port=8082
# 게이트웨이가 전달하는 X-Forwarded-* 헤더를 반영해 {baseUrl}이 게이트웨이 주소로 계산되게 함
server.forward-headers-strategy=framework

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_member?useUnicode=true&serverTimezone=Asia/Seoul

spring.jpa.hibernate.ddl-auto=update

spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}

spring.security.oauth2.client.registration.kakao.client-authentication-method=client_secret_post
spring.security.oauth2.client.registration.kakao.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.kakao.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.kakao.scope=account_email,profile_nickname,profile_image

spring.security.oauth2.client.provider.kakao.authorization-uri=https://kauth.kakao.com/oauth/authorize
spring.security.oauth2.client.provider.kakao.token-uri=https://kauth.kakao.com/oauth/token
spring.security.oauth2.client.provider.kakao.user-info-uri=https://kapi.kakao.com/v2/user/me
spring.security.oauth2.client.provider.kakao.user-name-attribute=id

# Access Token 30분, Refresh Token 14일 (밀리초)
jwt.access-token-expiration=1800000
jwt.refresh-token-expiration=1209600000

# 로그인 성공 후 프론트엔드로 리다이렉트할 주소
app.oauth2.redirect-uri=http://localhost:3000/oauth2/redirect

# order-service 호출 주소 - 컨테이너 배포 시 docker-compose 서비스명(예: http://order-service:8083)으로 교체
external.order-service.base-url=http://localhost:8083

# 서킷 브레이커 - order-service 호출 (인스턴스명은 @CircuitBreaker(name)과 일치해야 함)
resilience4j.circuitbreaker.instances.orderService.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.instances.orderService.sliding-window-size=20
resilience4j.circuitbreaker.instances.orderService.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.orderService.failure-rate-threshold=50
# read timeout(2초)보다 짧게 잡아 타임아웃으로 스레드가 묶이기 전에 서킷이 반응하게 함
resilience4j.circuitbreaker.instances.orderService.slow-call-duration-threshold=1s
resilience4j.circuitbreaker.instances.orderService.slow-call-rate-threshold=60
resilience4j.circuitbreaker.instances.orderService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.orderService.permitted-number-of-calls-in-half-open-state=3
# order-service 자체 장애만 실패로 집계 - 4xx는 호출 계약 오류이므로 제외
resilience4j.circuitbreaker.instances.orderService.record-exceptions[0]=com.park.ecommerce.exception.OrderServiceUnavailableException

# 서킷 상태와 전이 이벤트 확인용 - 운영 전환 시 노출 범위 재검토 필요
management.endpoints.web.exposure.include=health,circuitbreakers,circuitbreakerevents
