spring.application.name=payment-service
spring.config.import=optional:classpath:application-secret.properties

server.port=8084

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_payment?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul

spring.jpa.hibernate.ddl-auto=update

# 토스페이먼츠 API 주소 - 테스트·라이브 구분은 시크릿 키로 하므로 주소는 같다
# 시크릿 키는 application-secret.properties의 toss.payments.secret-key에 둔다 (테스트 키는 test_sk로 시작)
external.toss-payments.base-url=https://api.tosspayments.com
