spring.application.name=product-service
spring.config.import=optional:classpath:application-secret.properties

server.port=8081

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_product?useUnicode=true&serverTimezone=Asia/Seoul

spring.jpa.hibernate.ddl-auto=update

# JDBC 배치를 여러 행 INSERT 문 하나로 보내도록 함 - 없으면 batchUpdate도 문장을 한 건씩 실행
# URL 파라미터가 아닌 드라이버 속성으로 둔 이유: 배포 환경 변수나 테스트 컨테이너가 URL을 통째로 바꿔도 유지되도록
spring.datasource.hikari.data-source-properties.rewriteBatchedStatements=true

# 입고 예정서 처리 스케줄러 - 데모용으로 짧게 설정 (컬리 사례는 10분 간격 × 최대 144회)
inbound.interface.poll-delay=10s
inbound.interface.retry-interval=1m
inbound.interface.max-retry=10

# 재고 선점 만료 스케줄러 - 만료 시각이 지난 선점은 최대 이 주기만큼 늦게 해제된다
stock.reservation.expire-poll-delay=10s

# 상품 변경 이벤트 발행 - 검색 서비스가 구독해 색인한다
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# 브로커에 접속하지 못할 때 발행이 기본 60초 동안 멈춰 릴레이 회차가 밀리지 않도록 짧게 제한
spring.kafka.producer.properties.max.block.ms=5000
outbox.relay.poll-delay=1s
outbox.relay.topic=product.changed
