spring.application.name=product-service
spring.config.import=optional:classpath:application-secret.properties

server.port=8081

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_product?useSSL=false&useUnicode=true&serverTimezone=Asia/Seoul

spring.jpa.hibernate.ddl-auto=update

# 입고 예정서 처리 스케줄러 - 데모용으로 짧게 설정 (컬리 사례는 10분 간격 × 최대 144회)
inbound.interface.poll-delay=10s
inbound.interface.retry-interval=1m
inbound.interface.max-retry=10

# 재고 선점 만료 스케줄러 - 만료 시각이 지난 선점은 최대 이 주기만큼 늦게 해제된다
stock.reservation.expire-poll-delay=10s
